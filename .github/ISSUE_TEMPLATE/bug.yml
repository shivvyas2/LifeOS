name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: "Money tab, live session HUD, agenda widget, watch app"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: "iPhone 17 Pro, iOS 26.1; Apple Watch Series 11, watchOS 26.1"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Console output from Xcode, or a screenshot. Please remove anything personal.
