<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Your Almanac code</title>
  </head>
  <!--
    The app's tokens: canvas #F2F1EE, ink #141414, secondary #737373, accent
    #F05730, white card. Tables and inline styles throughout, because email
    clients strip <style> blocks, ignore flexbox, and Outlook renders through
    Word: a stylesheet that works in a browser is no evidence it works in an
    inbox.

    No images anywhere. The dot grid is drawn with table cells, so it survives
    the image blocking most clients apply by default, and there is nothing to
    host or have go missing in a year.
  -->
  <body style="margin:0;padding:0;background:#F2F1EE;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F2F1EE;">
      <tr>
        <td align="center" style="padding:44px 20px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:452px;">
            <tr>
              <td style="background:#FFFFFF;border-radius:30px;padding:0;overflow:hidden;">

                <!-- A band of the accent across the head of the card. The app
                     opens every module on a wash of its hue; this is the same
                     move in the one strip an email client will render
                     reliably. -->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <!-- Rounded on the td itself, not left to the card's
                       `overflow:hidden`, which most email clients ignore: the
                       band's square corners otherwise poke out past the card's
                       rounded ones. -->
                  <tr><td height="5" style="background:#F05730;border-radius:30px 30px 0 0;font-size:0;line-height:0;">&nbsp;</td></tr>
                </table>

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="padding:30px 32px 34px;">

                      <!-- The dot grid: the app's central motif, and the thing
                           that makes this recognisably from Almanac before a
                           word is read. -->
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 26px;">
                    <tr><td width="9" height="9" style="border-radius:50%;background:#141414;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#141414;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#DEDCD6;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#141414;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#DEDCD6;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#141414;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#141414;font-size:0;line-height:0;">&nbsp;</td></tr>
                    <tr><td colspan="13" height="6" style="font-size:0;line-height:0;">&nbsp;</td></tr>
                    <tr><td width="9" height="9" style="border-radius:50%;background:#141414;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#141414;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#141414;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#DEDCD6;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#141414;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#DEDCD6;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#DEDCD6;font-size:0;line-height:0;">&nbsp;</td></tr>
                    <tr><td colspan="13" height="6" style="font-size:0;line-height:0;">&nbsp;</td></tr>
                    <tr><td width="9" height="9" style="border-radius:50%;background:#DEDCD6;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#141414;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#141414;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#DEDCD6;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#141414;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#141414;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#DEDCD6;font-size:0;line-height:0;">&nbsp;</td></tr>
                    <tr><td colspan="13" height="6" style="font-size:0;line-height:0;">&nbsp;</td></tr>
                    <tr><td width="9" height="9" style="border-radius:50%;background:#141414;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#DEDCD6;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#141414;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#F05730;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#DEDCD6;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#DEDCD6;font-size:0;line-height:0;">&nbsp;</td><td width="6" style="font-size:0;line-height:0;">&nbsp;</td><td width="9" height="9" style="border-radius:50%;background:#DEDCD6;font-size:0;line-height:0;">&nbsp;</td></tr>
                      </table>

                      <p style="margin:0 0 7px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:#737373;">
                        Almanac
                      </p>

                      <h1 style="margin:0 0 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-0.7px;color:#141414;">
                        Your sign-in code
                      </h1>

                      <p style="margin:0 0 26px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#737373;">
                        Type this into the app to finish signing in.
                      </p>

                      <!-- The code, set the way the hub sets its date: large,
                           bold, tightly spaced, with nothing beside it. It is
                           the single thing this email exists to deliver. -->
                      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td align="center" style="background:#F2F1EE;border-radius:22px;padding:26px 12px;border:1px solid #E6E4DE;">
                            <span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:42px;font-weight:700;letter-spacing:12px;line-height:1;color:#141414;">{{ .Token }}</span>
                          </td>
                        </tr>
                      </table>

                      <p style="margin:24px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#737373;">
                        It expires shortly. If you didn't ask for it, nothing has happened to your account and you can ignore this.
                      </p>

                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding:20px 12px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#9A9A96;">
                Health, money, habits and plans, tracked together.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
